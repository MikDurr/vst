[project]
name = "mixlens"
version = "0.1.0"
description = "Measures your mix against reference tracks, flags drift, checks peak safety, and learns what predicts your regret."
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "demucs>=4.0",
    "torch>=2.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "streamlit>=1.32",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mixlens = "mixlens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
